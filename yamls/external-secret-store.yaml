# Vault Token Secret
# Note: For production, use Kubernetes auth method instead of token
# This is a simplified version for development/testing
apiVersion: v1
kind: Secret
metadata:
  name: vault-token
  namespace: default
type: Opaque
stringData:
  token: "root"
---
# ClusterSecretStore for Vault
# ClusterSecretStore can be used by ExternalSecrets in any namespace
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: vault-backend
spec:
  provider:
    vault:
      server: "http://vault.vault.svc.cluster.local:8200"
      path: "secret"
      version: "v2"
      auth:
        tokenSecretRef:
          name: "vault-token"
          key: "token"
          namespace: "default"

