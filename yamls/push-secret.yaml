# PushSecret to sync secret to remote Kubernetes cluster
# Note: The ClusterSecretStore is created by create-kubernetes-store.sh
# because it needs the server URL extracted from kubeconfig
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: app-credentials-push
  namespace: default
spec:
  refreshInterval: 1h
  deletionPolicy: Delete
  selector:
    secret:
      name: app-credentials
  data:
  - match:
      secretKey: username
      remoteRef:
        remoteKey: app-credentials
        property: username
  - match:
      secretKey: password
      remoteRef:
        remoteKey: app-credentials
        property: password
  secretStoreRefs:
  - name: kubernetes-remote-store
    kind: ClusterSecretStore
