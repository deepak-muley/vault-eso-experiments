apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: app-credentials
  namespace: default
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: app-credentials
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        username: "{{ .username | b64enc }}"
        password: "{{ .password | b64enc }}"
  data:
  - secretKey: username
    remoteRef:
      key: secret/app-credentials
      property: username
  - secretKey: password
    remoteRef:
      key: secret/app-credentials
      property: password

